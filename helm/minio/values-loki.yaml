# MinIO bucket, policy and user for Loki (e.g. a LokiStack from the Loki Operator).
# Use together with values-openshift.yaml, listed after it:
#
#   oc create secret generic minio-loki-user -n <ns> --from-literal=password=<password>
#   helm upgrade minio ./helm/minio -n <ns> \
#     -f helm/minio/values-openshift.yaml -f helm/minio/values-loki.yaml ...
#
# Loki then connects with access key "loki" and the password above, bucket "loki",
# endpoint http://minio.<ns>.svc.cluster.local:9000.
#
# Note: Helm replaces lists, it does not merge them. If you need more users,
# policies or buckets, add them here instead of in another values file.

users:
  - accessKey: loki
    existingSecret: minio-loki-user
    existingSecretKey: password
    policy: loki-rw

# Least privilege: object read/write/delete and listing on the "loki" bucket only.
policies:
  - name: loki-rw
    statements:
      - resources:
          - 'arn:aws:s3:::loki/*'
        actions:
          - "s3:GetObject"
          - "s3:PutObject"
          - "s3:DeleteObject"
          - "s3:AbortMultipartUpload"
          - "s3:ListMultipartUploadParts"
      - resources:
          - 'arn:aws:s3:::loki'
        actions:
          - "s3:ListBucket"
          - "s3:GetBucketLocation"
          - "s3:ListBucketMultipartUploads"

# Retention is enforced by Loki's compactor (LokiStack spec.limits.*.retention),
# so no versioning or object locking here: both would keep deleted chunks.
buckets:
  - name: loki
    policy: none
    purge: false
