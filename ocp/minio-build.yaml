# OpenShift build for MinIO from source using Dockerfile.ocp.
#
#   oc apply -f ocp/minio-build.yaml
#   oc start-build minio --follow
#
# Version metadata:
#   - COMMIT_ID: taken from OPENSHIFT_BUILD_COMMIT when OpenShift injects it,
#     otherwise "unknown". Override with --build-arg COMMIT_ID=<sha>.
#   - MINIO_VERSION: pinned below to the UTC commit time of the last upstream
#     commit included in this fork, so the binary matches the chart's
#     appVersion. When merging upstream changes, update BOTH:
#       - MINIO_VERSION below (e.g. 2026-02-12T20:18:48Z)
#       - appVersion in helm/minio/Chart.yaml (DEVELOPMENT.2026-02-12T20-18-48Z)
#     Get it with:
#       TZ=UTC git log -1 --format=%cd --date=iso-strict-local origin/master
#     If removed, Dockerfile.ocp defaults to build time.
apiVersion: v1
kind: List
items:
  - apiVersion: image.openshift.io/v1
    kind: ImageStream
    metadata:
      name: minio
      labels:
        app: minio
  - apiVersion: build.openshift.io/v1
    kind: BuildConfig
    metadata:
      name: minio
      labels:
        app: minio
    spec:
      runPolicy: Serial
      source:
        type: Git
        git:
          uri: https://github.com/diego-amv/minio.git
          ref: master
      strategy:
        type: Docker
        dockerStrategy:
          dockerfilePath: Dockerfile.ocp
          buildArgs:
            - name: MINIO_RELEASE
              value: DEVELOPMENT
            # Keep in sync with appVersion in helm/minio/Chart.yaml.
            - name: MINIO_VERSION
              value: "2026-02-12T20:18:48Z"
            # Raise when the build pod has more memory (~1.5-2 GiB per job).
            - name: GO_BUILD_JOBS
              value: "2"
      output:
        to:
          kind: ImageStreamTag
          name: minio:latest
      resources:
        requests:
          cpu: "2"
          memory: 4Gi
        limits:
          cpu: "4"
          memory: 6Gi
      triggers:
        - type: ConfigChange
